<!DOCTYPE html>
<html lang="fr">
<!--
  Page d'accueil / recherche globale : point d'entrée du site. Liste TOUS
  les seigneurs légendaires, toutes factions confondues (contrairement aux
  pages de faction qui n'affichent qu'une seule faction à la fois).
  Le contenu (onglets de faction #faction-tabs, grille de résultats
  #results-grid) est entièrement généré par js/search.js au chargement.
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Builds Total War Warhammer 3 — Recherche de seigneurs</title>
<link rel="icon" href="assets/favicon.ico">
<!-- Mêmes polices que les fiches, appelées ici plutôt que depuis la feuille
     pour éviter la sérialisation d'un @import. Deux familles seulement. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=EB+Garamond:ital,wght@0,400;0,700;1,400;1,700&display=swap">

<!-- Ordre obligatoire : socle.css (tokens, base) puis accueil.css, qui les
     consomme. Cette page ne charge PAS fiches.css — ni les 32 palettes de
     faction ni la mise en page en deux colonnes ne lui servent. -->
<link rel="stylesheet" href="css/socle.css">
<link rel="stylesheet" href="css/accueil.css">
</head>
<!-- La classe "search-theme" active la palette neutre de cette page (voir
     body.search-theme dans css/accueil.css), indépendante des thèmes de
     faction (.theme-*) utilisés sur les autres pages. -->
<body class="search-theme">

<div class="search-page">
  <!-- En-tête de page : titre, sous-titre, champ de recherche et onglets. -->
  <header class="search-hero">
    <h1 class="search-title">Builds Total War Warhammer 3</h1>
    <div class="search-subtitle">Recherche de seigneurs, toutes factions</div>
    <div class="search-divider"><span>❖</span></div>
    <!-- Champ de recherche texte libre : filtré en temps réel par
         js/search.js (écouteur sur l'événement "input").
         L'intitulé mentionne les UNITÉS depuis que la recherche les couvre :
         une aide de saisie qui n'annonce pas ce que le champ sait faire revient
         à ne pas avoir la fonctionnalité, personne n'essaie ce qui n'est pas
         proposé. -->
    <input type="search" id="search-input" class="search-input search-input-lg" placeholder="Rechercher un seigneur, une faction, une unité…" aria-label="Rechercher un seigneur, une épithète, une faction ou une unité de son build">
    <!-- Rempli dynamiquement par renderFactionTabs() (js/core.js), appelée
         depuis renderResults() (js/search.js). -->
    <nav class="faction-tabs" id="faction-tabs" aria-label="Filtrer par faction"></nav>
  </header>
  <!-- Contenu principal : grille de cartes de résultats, générée par
       renderResults() / resultCardHtml() dans js/search.js. -->
  <main class="results-grid" id="results-grid"></main>
</div>

<!-- core.js doit être chargé avant search.js : ce dernier utilise les
     fonctions qu'il expose (loadLords, filterLords, renderFactionTabs).
     La page d'accueil n'affiche aucune carte d'unité : elle ne charge donc
     aucun fichier js/units/<faction>.js. -->
<script src="js/core.js"></script>
<script src="js/search.js"></script>

</body>
</html>
